---
{{ if index .Values  "portal" "enabled" }}
{{- $fullName := .Release.Name }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullName }}-onboarding-process-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: onboarding-process-worker
              image: postgres:15
              imagePullPolicy: IfNotPresent

              env:
                - name: PGHOST
                  value: {{ printf "%s-%s" $fullName .Values.portal.postgresql.nameOverride | quote }}
                - name: PGPORT
                  value: {{ .Values.portal.postgresql.dbPort | quote }}
                - name: PGDATABASE
                  value: {{ .Values.portal.postgresql.dbName | quote }}
                - name: PGUSER
                  value: {{ .Values.portal.postgresql.auth.dbUser | quote }}
                - name: PGPASSWORD
                  value: {{ .Values.portal.postgresql.auth.password | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER password=$PGPASSWORD sslmode=disable"
                  
                  echo "Executing onboarding SQL script..."

                  psql -v ON_ERROR_STOP=1 -f /sql/skip-clearinghouse.sql

                  psql -v ON_ERROR_STOP=1 -f /sql/skip-bpdm.sql

                  echo "All queries executed successfully."
              volumeMounts:
                - name: sql
                  mountPath: /sql

          volumes:
            - name: sql
              configMap:
                name: onboarding-process-worker-configmap
              # command:
              #   - /bin/sh
              #   - -c
              #   - |
              #     echo "Running onboarding status check..."

              #     psql <<EOF
              #     SELECT id, status, created_at
              #     FROM onboarding_process
              #     WHERE status NOT IN ('COMPLETED', 'FAILED')
              #     ORDER BY created_at ASC;
              #     EOF

              #     echo "Done."
{{ end }}