---
portal:
  enabled: false
  replicaCount: 1
  postgresql:
    ## TEMPORALY UNTIL NEW PORTAL UPDATE
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"
    commonLabels:
      app.kubernetes.io/version: "15"
    ## UNTIL HERE
    nameOverride: "portal-backend-postgresql"
    architecture: standalone
    auth:
      password: "dbpasswordportal"
      portalPassword: "dbpasswordportal"
      replicationPassword: "dbpasswordportal"
      provisioningPassword: "dbpasswordportal"
    primary:
      persistence:
        enabled: true
  portalAddress: "https://portal.staging.construct-x.net"
  portalBackendAddress: "https://portal-backend.staging.construct-x.net"
  centralidp:
    address: "https://centralidp.staging.construct-x.net"
  sharedidpAddress: "https://sharedidp.staging.construct-x.net"
  semanticsAddress: "https://semantics.staging.construct-x.net"
  bpdm:
    poolAddress: "https://business-partners.staging.construct-x.net"
    poolApiPath: "/pool/v6"
    portalGateAddress: "https://business-partners.staging.construct-x.net"
    portalGateApiPath: "/gate/v6"
  custodianAddress: "https://ssi-dim-wallet-stub.staging.construct-x.net"
  dimWrapper:
    baseAddress: "https://ssi-dim-wallet-stub.staging.construct-x.net"
    apiPath: "/api/dim"
    tokenAddress: "https://ssi-dim-wallet-stub.staging.construct-x.net/oauth/token"
  decentralIdentityManagementAuthAddress: "https://ssi-dim-wallet-stub.staging.construct-x.net/api/sts"
  sdfactoryAddress: "https://sdfactory.staging.construct-x.net"
  # -- no configuration for clearinghouse because it's an external component
  clearinghouse:
    default:
      baseAddress: "https://validation.staging.construct-x.net"
      # -- clientId and clientSecret aren't in the centralidp Keycloak
      clientId: "clearinghouse-client-id-default"
      clientSecret: ""
      tokenAddress: "https://someiam.staging.construct-x.net/realms/example/protocol/openid-connect/token"
  issuerComponentAddress: "https://ssi-credential-issuer.staging.construct-x.net"
  frontend:
    portal:
      image:
        name: "registry.onstackit.cloud/constructx/portal-frontend"
        portaltag: "10092025"
        pullPolicy: "Always"
        pullSecrets:
          - name: harbor-creds
    resources:
      requests:
        cpu: 25m
        memory: 125M
      limits:

        cpu: 75m
        memory: 125M
    assets:
      image:
        name: "registry.onstackit.cloud/constructx/portal-assets"
        assetstag: "10092025"
        pullPolicy: "Always"
        pullSecrets:
          - name: harbor-creds
      resources:
        requests:
          cpu: 25m
          memory: 100M
        limits:
          cpu: 45m
          memory: 100M
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
        kubernetes.io/ingress.class: "nginx"
        external-dns.alpha.kubernetes.io/hostname: "portal.staging.construct-x.net"
        external-dns.alpha.kubernetes.io/ttl: "300"
        nginx.ingress.kubernetes.io/rewrite-target: "/$1"
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://*.staging.construct-x.net"
      tls:
        # -- Provide tls secret.
        - secretName: "portal.staging-tls"
          # -- Provide host for tls secret.
          hosts:
            - "portal.staging.construct-x.net"
      hosts:
        - host: "portal.staging.construct-x.net"
          paths:
            - path: "/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "portal"
                port: 8080
            - path: "/registration/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "registration"
                port: 8080
            - path: "/((assets|documentation)/.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "assets"
                port: 8080
  backend:
    dotnetEnvironment: "Development"
    useDimWallet: true
    keycloak:
      central:
        clientId: "sa-cl1-reg-2"
        clientSecret: "changeme"
        jwtBearerOptions:
          requireHttpsMetadata: "false"
      shared:
        clientId: "sa-cl1-reg-1"
        clientSecret: "changeme"
    registration:
      logging:
        default: "Debug"
        bpdmLibrary: "Debug"
        registrationService: "Debug"
      swaggerEnabled: true
    administration:
      logging:
        default: "Debug"
        businessLogic: "Debug"
        sdfactoryLibrary: "Debug"
        bpdmLibrary: "Debug"
        custodianLibrary: "Debug"
      serviceAccount:
        encryptionConfigs:
          index0:
            encryptionKey: "deb8261ec7b89c344f1c5ef5a11606e305f14e0d231b1357d90ad0180c5081d3"
      issuerdid: "did:web:ssi-dim-wallet-stub.staging.construct-x.net:BPNL00000003CRHK"
      swaggerEnabled: true
    appmarketplace:
      logging:
        default: "Debug"
        offersLibrary: "Debug"
      swaggerEnabled: true
    services:
      logging:
        default: "Debug"
        offersLibrary: "Debug"
      swaggerEnabled: true
    notification:
      logging:
        default: "Debug"
      swaggerEnabled: true
    processesworker:
      clearinghouseConnectDisabled: true
      logging:
        default: "Debug"
        processesLibrary: "Debug"
        bpdmLibrary: "Debug"
        clearinghouseLibrary: "Debug"
        custodianLibrary: "Debug"
        sdfactoryLibrary: "Debug"
        offerProvider: "Debug"
