        image: registry.onstackit.cloud/constructx/portal-iam:15092025-latest
        imagePullPolicy: Always
        imagePullSecrets:
          - name: harbor-creds
        pullSecrets:
          - name: harbor-creds
        command:
          - sh
        args:
          - -c
          - |
            echo "Copying themes..."
            cp -R /import/themes/catenax-central/* /themes
        volumeMounts:
          - name: themes
            mountPath: /themes
    imagePullSecrets:
      - name: harbor-creds
    pullSecrets:
      - name: harbor-creds
    ingress:
      enabled: true
      ingressClassName: "nginx"
      hostname: "centralidp.staging.construct-x.net"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
        external-dns.alpha.kubernetes.io/hostname: "centralidp.staging.construct-x.net"
        external-dns.alpha.kubernetes.io/ttl: "300"
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://centralidp.staging.construct-x.net"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
